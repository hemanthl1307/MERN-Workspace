<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap-CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container text-center"> 
        <h3 >Pricing</h3>
        <p >Please check out out most effective payment methods</p>
        <div class="row justify-content-evenly">
        <div class="card col-xl-3 col-md-4">
        <div class="card-header bg-body-secondary">Free</div>
            <div class="card-body">
                <h3 class="card-title">$0/mo</h3>
                <p>10 users included</p>
                <p>2 GB of storage</p>
                <p>Email support</p>
                <button class="btn btn-outline-primary">Sign up for free</button>
            </div>
        </div>
        <div class="card col-xl-3 col-md-4">
        <div class="card-header bg-body-secondary">Free</div>
            <div class="card-body">
                <h3 class="card-title">$15/mo</h3>
                <p>20 users included</p>
                <p>10 GB of storage</p>
                <p> priority email support</p>
                <button class="btn btn-primary">Get started</button>
            </div>
        </div>
         <div class="card col-xl-3 col-md-8">
            <div class="card-header bg-body-secondary">Free</div>
            <div class="card-body">
                <h3 class="card-title">$29/mo</h3>
                <p>30 users included</p>
                <p>15 GB of storage</p>
                <p>Phone & email support</p>
                <button class="btn btn-primary">Contact us</button>
            </div>
        </div>  
    </div>
    </div>
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
