<!--Using HTML to Create Design in Webpage-->
 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index1.css">
    <title>Document</title>
    <!--Embedded using style tag-->
    <style>
        p{
            color:blue;
        }
    </style>
</head>
<body>
    <h1>Level-1:To study about Including CSS</h1>
    <!--Inline property-->
    <h1 style="color:red">Hello Hemanth</h1>
    <h2 style="background-color:red">How are You</h2>
    <p>This styling was added using Embedded stylesheet using style tag</p>
    <h3>This styling was added using External stylesheet</h3>
</body>
</html>
