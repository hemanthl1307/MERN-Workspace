<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM-JS</title>
    <link rel="stylesheet" href="style1.css">
</head>
<body>
     <h1>Inline events</h1>
    <button onclick="console.log('Button clicked');">Click Me</button>
    <button onclick="alert('Hello Mr Button CLicker');">Click Me</button>
    <br><br>
    <h1>Keyboard events</h1>
    <button id="btn1">CLICK ME!</button>
    <button class="btn">LIKE1!</button>
    <button class="btn">LIKE2!</button>
    <button class="btn">LIKE3!</button>
    <button class="mousebtn">POST1!</button>
    <button class="mousebtn">POST2!</button>
    <br><br><br>
    <button class="btnsub">SUBMIT1</button>
    <button class="btnsub">SUBMIT2</button>
    <p>This is a paragraph</p>
    <div class="box"></div>
    <button id="hbtn">This button</button>
    <p id="pnew">Hello i am a paragraph</p>
    <h1>I am a heading h1</h1>
    <h3>I am a heading h3</h3>
    <button id="btnclick">Click here!</button><br><br>
    <h1>Keyboard events</h1>
    <button id="btnevent">Event Button</button><br><br>
    <input placeholder="type something">
    <button id="formbtn">Click Me!</button>
    <br><br><br>
    <h1>Form events</h1>
    <form action="/action">
        <input placeholder="Enter username">
        <button>Register</button>
    </form>
    <br>
    <form id="regform">
        <input type="text" id="user" placeholder="Enter Username">
        <input type="password" id="pass" placeholder="Enter password">
        <input type="email" id="mail" placeholder="Enter Email">
        <button id="regbtn">Register</button>
    </form>
    <script src="app2.js"></script>
</body>
</html>
